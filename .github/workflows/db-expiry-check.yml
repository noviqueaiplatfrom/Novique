name: Render DB expiry check

# Render's free Postgres plan auto-deletes the database 30 days after
# creation, with no backup/restore. novique-db has already been silently
# wiped once this way (backend crash-looped for ~50min until Render's
# blueprint_sync noticed and recreated it empty). This checks the actual
# expiresAt via Render's API daily and raises a loud warning well before
# it happens again.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Check novique-db expiry
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          response=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/postgres?limit=20")

          expires_at=$(echo "$response" | jq -r '.[] | select(.postgres.name == "novique-db") | .postgres.expiresAt')
          db_id=$(echo "$response" | jq -r '.[] | select(.postgres.name == "novique-db") | .postgres.id')

          if [ -z "$expires_at" ] || [ "$expires_at" = "null" ]; then
            echo "::error::Could not find a Postgres instance named novique-db via the Render API. It may have already been deleted."
            exit 1
          fi

          expires_epoch=$(date -d "$expires_at" +%s)
          now_epoch=$(date -u +%s)
          days_left=$(( (expires_epoch - now_epoch) / 86400 ))

          echo "novique-db ($db_id) expires at $expires_at — $days_left day(s) left."

          WARN_THRESHOLD=10
          if [ "$days_left" -le "$WARN_THRESHOLD" ]; then
            title="⚠️ novique-db expires in ${days_left}d ($expires_at)"
            body="Render's free Postgres plan will **delete novique-db (${db_id})** on **${expires_at}** unless it's upgraded to a paid plan or migrated beforehand.

          This has already happened once (2026-10-03): the backend crash-looped for ~50 minutes and all prior data (articles, user accounts, bookmarks) was lost when Render auto-recreated an empty database.

          Action needed before the expiry date:
          - Upgrade novique-db to a paid plan in the Render dashboard, **or**
          - Migrate to a database that won't auto-expire.

          This issue was opened automatically by \`.github/workflows/db-expiry-check.yml\`."

            existing=$(gh issue list --search "novique-db expires in" --state open --json number --jq '.[0].number' || true)
            if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
              gh issue comment "$existing" --body "$body"
              gh issue edit "$existing" --title "$title"
            else
              gh issue create --title "$title" --body "$body"
            fi

            echo "::error::novique-db expires in ${days_left} day(s) — see the opened/updated GitHub issue."
            exit 1
          fi
