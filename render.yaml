services:
  # 1. FastAPI Backend API (Native Python Runtime)
  #
  # Ingestion runs on the in-process scheduler (backend/app/scheduler.py)
  # inside this uvicorn process. It replaced `bootstrap && (celery ... &) &&
  # uvicorn`, which had two silent failure modes: a missing/unreachable DB
  # made bootstrap exit so uvicorn never bound its port (every request hung),
  # and a dead backgrounded Celery worker was never restarted. Now the API
  # always boots, reports DB/pipeline health at /api/status, and retries the
  # DB in the background.
  - type: web
    name: novique-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # External Postgres, set in the Render dashboard (not a Render free DB:
      # those are deleted 30 days after creation, which wiped all data on
      # 2026-10-03 and again on 2026-11-02). Any postgres:// or postgresql://
      # URL works; the app normalizes the scheme.
      - key: DATABASE_URL
        sync: false
      # Only used by the optional Celery runner (app/celery_app.py); the
      # production scheduler doesn't need Redis.
      - key: REDIS_URL
        fromService:
          type: redis
          name: novique-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://novique-frontend.onrender.com,https://novique-ai-five.vercel.app,https://novique-ai.com,https://www.novique-ai.com"
      - key: GOOGLE_CLIENT_ID
        value: 338636590792-t166pujl1hpuroea7p7idnn4em4tpht4.apps.googleusercontent.com
      - key: INGEST_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: no-reply@novique-ai.com
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.12.0"

  # 2. Redis Instance
  - type: redis
    name: novique-redis
    plan: free
    ipAllowList: []

  # 3. Next.js Frontend (Native Node Runtime)
  - type: web
    name: novique-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://novique-backend.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 338636590792-t166pujl1hpuroea7p7idnn4em4tpht4.apps.googleusercontent.com
